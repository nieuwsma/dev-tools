# One session per project; name its windows by activity with prefix + comma.
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g default-terminal 'tmux-256color'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

# Persistent host and project identity, including the terminal window title.
set -g status on
set -g status-left-length 80
set -g status-left '#[bold] #h · #S #[default] | '
set -g status-right-length 100
set -g status-right ' cwd: #{pane_current_path} '
set -g status-style 'fg=@MACHINE_FOREGROUND@,bg=@MACHINE_COLOR@'
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '
setw -g window-status-current-style 'fg=@ACTIVE_FOREGROUND@,bg=@ACTIVE_BACKGROUND@,bold'
set -g set-titles on
set -g set-titles-string '#h · #S'
set -g allow-rename off
setw -g automatic-rename off
